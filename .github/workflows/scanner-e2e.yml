name: Scanner E2E

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so plugin updates that cause new false positives show up without a code change
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Scan clean site and planted samples
        run: bash tests/e2e/run.sh
